plugins { id 'com.android.application' }
android {
    namespace 'app.cardchess.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'app.cardchess.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
def prepareOffline = tasks.register('prepareOffline', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'android/prepare-build.py'
    inputs.dir '../../backend/src/main/java'
    inputs.file '../../backend/src/main/resources/application.yml'
    inputs.file '../../prompts/chatgpt-opponent.txt'
    inputs.dir '../../frontend/dist'
    inputs.file 'src/main/assets/android.js'
    inputs.file '../prepare-build.py'
    outputs.dir layout.buildDirectory.dir('generated/offline')
}
android.sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/offline/java')
android.sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/offline/assets')]
tasks.named('preBuild').configure { dependsOn prepareOffline }
