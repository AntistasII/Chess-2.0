plugins { id 'com.android.application' }
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('signing.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
android {
    namespace 'app.cardchess.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'app.cardchess.mobile'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '2.1.0'
    }
    signingConfigs {
        release {
            if (releasePropertiesFile.exists()) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
def prepareOffline = tasks.register('prepareOffline', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'android/prepare-build.py'
    inputs.dir '../../backend/src/main/java'
    inputs.file '../../backend/src/main/resources/application.yml'
    inputs.file '../../prompts/chatgpt-opponent.txt'
    inputs.dir '../../frontend/dist'
    inputs.file 'src/main/assets/android.js'
    inputs.file '../prepare-build.py'
    outputs.dir layout.buildDirectory.dir('generated/offline')
}
android.sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/offline/java')
android.sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/offline/assets')]
tasks.named('preBuild').configure { dependsOn prepareOffline }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'bundleRelease' } && !releasePropertiesFile.exists()) {
        throw new GradleException('Release signing requires android/signing.properties')
    }
}
