server:
  port: ${PORT:8080}
  # Файл кнопок «Сохранить» и «Продолжить».
  save-file: data/saved-game.json

# Вставьте API-ключ между кавычками и перезапустите Java-сервер.
openai:
  response-timeout: 10s
  max-retries: 10
  api-key: "${OPENAI_API_KEY:}"
  model: "${OPENAI_MODEL:gpt-6-luna}"

chess:
  game:
    back-rank: RNBQKBNR
    default-mode: ai
    search:
      easy:
        depth: 2
        nodes: 3000
        milliseconds: 500
      normal:
        depth: 6
        nodes: 60000
        milliseconds: 1500
      hard:
        depth: 9
        nodes: 250000
        milliseconds: 3500
    opponents:
      ai:
        hand-limit: 3
        difficulty: normal
      chatgpt:
        hand-limit: 3
        difficulty: normal
      network:
        hand-limit: 3
        difficulty: normal
      human:
        hand-limit: 3
        difficulty: normal
